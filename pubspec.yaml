name: mr_app
description: "Prisha Pharma — Medical Representative app."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Pinned to the Dart shipped with the installed Flutter (3.44.4 / Dart 3.12.2).
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Material moved out of the SDK: package:flutter/material.dart is
  # deprecated after Flutter v3.47.0-0.0.pre in favour of this package, which
  # defines its own TextTheme/ThemeData - NOT re-exports of the SDK's. Mixing
  # the two gives "TextTheme can't be assigned to TextTheme". So everything
  # in lib/ imports material_ui.
  #
  # Held at 1.2.0, and google_fonts at 8.x, because the installed Flutter is
  # 3.44.4 (Dart 3.12.2): material_ui 1.4.0+ and google_fonts 9 both require
  # Dart ^3.13.0, and 1.3.0 is retracted on pub. google_fonts 8.x has not
  # migrated, so it cannot hand material_ui a TextTheme - see the note in
  # lib/core/app_theme.dart. Upgrading Flutter to a Dart >=3.13 toolchain is
  # what unpins all of this; raise both together when that happens.
  material_ui: ^1.2.0

  # State. Riverpod, not the MobX the ProKit design ships with — we harvest
  # that kit's look, not its state layer (docs/architecture.md).
  flutter_riverpod: ^3.5.0

  go_router: ^18.1.4
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  google_fonts: ^8.2.1
  intl: ^0.20.2

  # Attendance punches and visits are geo-stamped; the server stores the
  # coordinates the device reads.
  geolocator: ^14.1.2

  # The shopfront photo on a visit. image_picker, not camera: it hands the
  # shutter to the phone's own camera app, so there is no preview surface to
  # build and no camera permission of our own to request on Android.
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
