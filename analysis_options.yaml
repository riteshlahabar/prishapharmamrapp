# Static analysis for the MR app. Run: flutter analyze
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Vendored Medilab ProKit, kept as a design reference only. It is a
    # third-party kit on nb_utils + MobX and is never compiled into this
    # app, so its 4,400-odd lint hits would drown out our own.
    - design/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # The app talks to one server and surfaces failures through
    # ApiFailure/describeError; a stray print would be the wrong channel.
    avoid_print: true
    prefer_single_quotes: true
